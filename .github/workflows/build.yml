name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q *.zip
      - name: Build web app and Android project
        working-directory: ac-factory-android
        run: |
          npm install
          npm run build
          npx cap add android
          npm run icons
          npx cap sync android
      - name: Storage permissions for old Android
        working-directory: ac-factory-android
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - name: Build debug APK
        working-directory: ac-factory-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AC-Maamal-APK
          path: ac-factory-android/android/app/build/outputs/apk/debug/app-debug.apk
